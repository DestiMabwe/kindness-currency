<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home Cooked Meal Coupon</title>
<style>
  :root{
    --red: rgb(131, 131, 228); /*  border color for the coupon */
    --red-dark: #D42A42; /* GOOD FOR: color for the coupon */
    --cream: #eeeae7; /* background color for the coupon */
    --blue: #3748c4; /* subtitletext color for the coupon */
    --barcode-ink: #2A2A2A;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0e9e4;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .coupon{
    position: relative;
    width: 620px;
    max-width: 92vw;
    height: 260px;
    background: var(--red);
    border-radius: 26px;
    padding: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.18);
  }

  .coupon-inner{
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--cream);
    border-radius: 16px;
    display: grid;
    grid-template-columns: 130px 1px 1fr;
    overflow: hidden;
  }

  /* notches (the punched circles on top/bottom of the perforation) */
  .coupon-inner::before,
  .coupon-inner::after{
    content: "";
    position: absolute;
    left: 130px;
    transform: translateX(-50%);
    width: 34px;
    height: 34px;
    background: var(--red);
    border-radius: 50%;
    z-index: 2;
  }
  .coupon-inner::before{ top: -17px; }
  .coupon-inner::after{ bottom: -17px; }

  /* Barcode stub */
  .stub{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 10px;
  }

  .barcode{
    width: 50px;
    height: 190px;
    background-image: repeating-linear-gradient(
      90deg,
      var(--barcode-ink) 0px,
      var(--barcode-ink) 2px,
      transparent 2px,
      transparent 4px,
      var(--barcode-ink) 4px,
      var(--barcode-ink) 5px,
      transparent 5px,
      transparent 8px,
      var(--barcode-ink) 8px,
      var(--barcode-ink) 11px,
      transparent 11px,
      transparent 13px
    );
    background-size: 13px 100%;
  }

  .stub-label{
    position: absolute;
    left: 50%;
    top: 15%;
    transform: translate(-15%, -70%) rotate(-90deg);
    white-space: nowrap;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #6b6b6b;
    margin-top: 92px;
  }

  /* Perforation line */
  .perforation{
    position: relative;
    background-image: repeating-linear-gradient(
      to bottom,
      #f2b9c1 0px,
      #f2b9c1 8px,
      transparent 8px,
      transparent 16px
    );
  }

  /* Main content */
  .content{
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px 28px;
    position: relative;
  }

  .eyebrow{
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--red-dark);
    margin: 0 0 6px 0;
  }

  .headline{
    font-size: 40px;
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--red-dark);
    margin: 0;
    text-transform: uppercase;
    font-family: Georgia, 'Times New Roman', serif;
  }

  .subline{
    margin-top: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--blue);
  }
  /* flower decoration (SVG) 
  .flowers{
    position: absolute;
    right: 22px;
    bottom: 18px;
    width: 130px;
    height: 130px;
    opacity: 0.95;
  }*/

  .meal-image{
    position: absolute;
    right: 22px;
    bottom: 18px;
    width: 130px;
    height: 180px; /*potrait aspect ratio*/
    object-fit: cover;
    border-radius: 8px;
    opacity: 0.95;
  }

  @media (max-width: 560px){
    .coupon{ height: 300px; }
    .headline{ font-size: 30px; }
    .flowers{ display: none; }
  }
</style>
</head>
