<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative; width:100%; box-sizing:border-box; opacity:{{ cardOpacity }}; transition:opacity .3s ease;">
  <div style="position:relative; display:flex; align-items:stretch; width:100%; min-height:148px; box-sizing:border-box; border:2px solid {{ accent }}; border-radius:16px; overflow:hidden; background:{{ backgroundColor }}; box-shadow:0 10px 26px -16px rgba(26,26,46,0.45);">

    <!-- effect: soft glow -->
    <sc-if value="{{ fxGlow }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute; inset:0; pointer-events:none; background:radial-gradient(120px 90px at 30% 25%, {{ accentGlow }}, transparent 70%);"></div>
    </sc-if>
    <!-- effect: confetti -->
    <sc-if value="{{ fxConfetti }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute; inset:0; pointer-events:none;">
        <span style="position:absolute; top:14%; left:12%; width:7px; height:7px; border-radius:2px; background:#C2185B; transform:rotate(20deg);"></span>
        <span style="position:absolute; top:62%; left:8%; width:6px; height:6px; border-radius:50%; background:#FF8F00;"></span>
        <span style="position:absolute; top:30%; left:40%; width:5px; height:10px; border-radius:2px; background:#D4658A; transform:rotate(-25deg);"></span>
        <span style="position:absolute; top:74%; left:34%; width:7px; height:7px; border-radius:2px; background:#FF8F00; transform:rotate(15deg);"></span>
        <span style="position:absolute; top:18%; left:60%; width:6px; height:6px; border-radius:50%; background:#C2185B;"></span>
        <span style="position:absolute; top:50%; left:54%; width:5px; height:9px; border-radius:2px; background:#FF8F00; transform:rotate(35deg);"></span>
        <span style="position:absolute; top:82%; left:60%; width:6px; height:6px; border-radius:2px; background:#D4658A; transform:rotate(-15deg);"></span>
      </div>
    </sc-if>
    <!-- effect: sparkle -->
    <sc-if value="{{ fxSparkle }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute; inset:0; pointer-events:none; color:{{ accent }};">
        <span style="position:absolute; top:12%; left:14%; font-size:13px; opacity:.5;">✦</span>
        <span style="position:absolute; top:58%; left:9%; font-size:9px; opacity:.4;">✦</span>
        <span style="position:absolute; top:34%; left:46%; font-size:11px; opacity:.45;">✦</span>
        <span style="position:absolute; top:78%; left:40%; font-size:8px; opacity:.35;">✦</span>
        <span style="position:absolute; top:22%; left:62%; font-size:10px; opacity:.4;">✦</span>
      </div>
    </sc-if>

    <!-- main body -->
    <div style="position:relative; flex:1; min-width:0; padding:16px 14px 14px 18px; display:flex; flex-direction:column;">
      <div style="position:absolute; top:6px; right:10px; font-size:46px; line-height:1; color:{{ accent }}; opacity:0.14; pointer-events:none; font-family:'DM Sans',sans-serif;">{{ motif }}</div>
      <div style="font-family:'DM Sans',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:{{ accent }};">{{ framingLabel }}</div>
      <div style="margin-top:5px; font-family:{{ titleFontFamily }}; font-style:{{ titleFontStyle }}; font-weight:700; font-size:21px; line-height:1.12; color:#1A1A2E; padding-right:30px; text-wrap:balance;">{{ serviceTitle }}</div>
      <div style="margin-top:7px; font-family:'DM Sans',sans-serif; font-size:12.5px; line-height:1.4; color:#2C2C2C; opacity:0.82;">{{ microCopy }}</div>
      <div style="flex:1; min-height:8px;"></div>
      <div style="margin-top:8px; display:flex; align-items:center; gap:7px;">
        <span style="display:inline-block; width:5px; height:5px; border-radius:50%; background:{{ accent }}; opacity:.6; flex:none;"></span>
        <span style="font-family:'DM Sans',sans-serif; font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:#2C2C2C; opacity:0.55;">{{ finePrint }}</span>
      </div>
      <sc-if value="{{ showRedeem }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ onRedeem }}" style="margin-top:13px; align-self:flex-start; border:none; cursor:pointer; background:#C2185B; color:#fff; font-family:'DM Sans',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.01em; padding:10px 18px; border-radius:999px; box-shadow:0 8px 18px -8px rgba(194,24,91,0.7);" style-hover="background:#a8154f;">Redeem This ♥</button>
      </sc-if>
    </div>

    <!-- perforation + stub -->
    <div style="position:relative; width:48px; flex:none; border-left:2px dashed {{ accentSoft }}; display:flex; align-items:center; justify-content:center; padding:10px 0;">
      <div style="display:flex; align-items:stretch; gap:2.5px; height:78%;">
        <div style="width:2px; background:#1A1A2E; opacity:.78;"></div>
        <div style="width:4px; background:#1A1A2E; opacity:.78;"></div>
        <div style="width:1.5px; background:#1A1A2E; opacity:.78;"></div>
        <div style="width:3px; background:#1A1A2E; opacity:.78;"></div>
        <div style="width:1.5px; background:#1A1A2E; opacity:.78;"></div>
        <div style="width:2.5px; background:#1A1A2E; opacity:.78;"></div>
        <div style="width:1.5px; background:#1A1A2E; opacity:.78;"></div>
        <div style="width:3.5px; background:#1A1A2E; opacity:.78;"></div>
      </div>
      <!-- punched notches -->
      <div style="position:absolute; top:-9px; left:-9px; width:16px; height:16px; border-radius:50%; background:{{ punchColor }};"></div>
      <div style="position:absolute; bottom:-9px; left:-9px; width:16px; height:16px; border-radius:50%; background:{{ punchColor }};"></div>
    </div>

    <!-- redeemed stamp -->
    <sc-if value="{{ isRedeemed }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;">
        <div style="transform:rotate(-11deg); border:3px solid #C2185B; color:#C2185B; background:rgba(255,248,240,0.62); border-radius:10px; padding:7px 16px; font-family:'Playfair Display',serif; font-style:italic; font-weight:700; font-size:21px; letter-spacing:0.02em; box-shadow:0 4px 14px -6px rgba(194,24,91,0.5);">Redeemed ♥</div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:190},&quot;serviceTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;One Home-Cooked Meal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;microCopy&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Made with extra love, just the way you like it&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;finePrint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;No expiry · Redeemable anytime&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fontChoice&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;playfair&quot;,&quot;dm-sans&quot;],&quot;default&quot;:&quot;playfair&quot;,&quot;tsType&quot;:&quot;'playfair' | 'dm-sans'&quot;},&quot;backgroundColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFF8F0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;backgroundEffect&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;confetti&quot;,&quot;sparkle&quot;,&quot;soft-glow&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sent&quot;,&quot;viewed&quot;,&quot;redeemed&quot;],&quot;default&quot;:&quot;sent&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;motif&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;❀&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C2185B&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;framingLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GOOD FOR&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showRedeem&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;punchColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFF8F0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onRedeem&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const font = p.fontChoice || 'playfair';
    const accent = p.accent || '#C2185B';
    const isRedeemed = p.status === 'redeemed';
    return {
      serviceTitle: p.serviceTitle ?? 'Your kind act',
      microCopy: p.microCopy ?? '',
      finePrint: p.finePrint ?? '',
      backgroundColor: p.backgroundColor || '#FFF8F0',
      accent,
      accentSoft: accent + '66',
      accentGlow: accent + '33',
      punchColor: p.punchColor || '#FFF8F0',
      motif: p.motif || '❀',
      framingLabel: p.framingLabel || 'GOOD FOR',
      titleFontFamily: font === 'dm-sans' ? "'DM Sans', sans-serif" : "'Playfair Display', serif",
      titleFontStyle: font === 'dm-sans' ? 'normal' : 'italic',
      isRedeemed,
      showRedeem: !!p.showRedeem && !isRedeemed,
      fxConfetti: p.backgroundEffect === 'confetti',
      fxSparkle: p.backgroundEffect === 'sparkle',
      fxGlow: p.backgroundEffect === 'soft-glow',
      onRedeem: p.onRedeem || (() => {}),
      cardOpacity: isRedeemed ? 0.72 : 1,
    };
  }
}
</script>
</body>
</html>
